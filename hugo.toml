baseURL = "https://go-images.github.io/"
title = "go-images"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# The design -- layouts/partials/styles.html, theme-toggle.html,
# fork-ribbon.html and icons/{github,book}.html -- comes from the shared Hugo
# module github.com/go-fleettools/landingkit, not from copies here. Its version
# is pinned in go.mod (Renovate bumps it), and kit.go keeps `go mod tidy` from
# deleting that requirement. A file of the same name under layouts/partials/
# would silently override the module's.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

# ⛔ THE REPOSITORY LIST LIVES HERE, and that is not a presentation choice. The
# fleet's drift check (go-fleettools/docscan) reads a landing's hugo.toml and
# data/*.yaml; this landing had its repositories written into
# layouts/index.html as hand-made cards, so the check could see NO repository
# list at all and reported this organisation as advertising NOTHING, with five
# repositories invisible -- while the page itself was served perfectly well and
# named four of them. A list a tool cannot read is a list that cannot be
# checked.
[params]
  # The architectures the suite RUNS on. SIMD kernels exist for three of them;
  # the portable scalar core is what the other three run, which is why this
  # list is the test matrix and not the kernel list.
  arches = ["amd64", "arm64", "riscv64", "loong64", "ppc64le", "s390x"]

[params.brand]
# Generated by go-fleettools/landingkit from the organisation's mark: the
# colours are READ from the logo's gradient, never chosen. Do not add other
# keys: neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 5.18:1, bright on the dark background 8.53:1.
  base = "#c2410c"
  deep = "#762807"
  bright = "#fb923c"
  shadow = "rgba(194,65,12,.7)"
  glow = "rgba(194,65,12,.6)"
  wash = "rgba(194,65,12,.10)"
  washDeep = "rgba(118,40,7,.06)"
  chipBg = "#fff2e8"
  chipBorder = "#fedec4"
  chipFg = "#762807"
  chipBgDark = "rgba(251,146,60,.14)"
  chipBorderDark = "rgba(251,146,60,.32)"
  chipFgDark = "#fdc394"
  statsEnd = "#fee5d0"
  bandText = "#feeee0"

[[params.repos]]
  name = "images"
  pkg = "github.com/go-images/images"
  url = "https://github.com/go-images/images"
  status = "ready"
  blurb = "**The library**: the `scikit-image` vocabulary in pure Go. Filters (`GaussianBlur`, `BoxBlur`, `Median`, `Sharpen`), edges (`Sobel`, `Prewitt`, `Scharr`, `Laplacian`, `Canny`), morphology (`Erode`, `Dilate`), geometry (`Resize`, `Rotate`, `Crop`, `Flip`) and colour (`Grayscale`, `RGBToHSV`, `Otsu`). SIMD kernels from [go-asmgen](https://github.com/go-asmgen) on amd64 (SSE2), arm64 (NEON) and s390x (vector), and it **beats scikit-image** on the separable hot operations — box blur and Sobel — with pages that say where it does not."

[[params.repos]]
  name = "depth"
  pkg = "github.com/go-images/depth"
  url = "https://github.com/go-images/depth"
  status = "ready"
  blurb = "**One picture in, two eyes out.** Depth guessed from cues in the picture itself (`Cues`), softened (`Soften`), and both eyes synthesised (`Views`) — for a headset or a 3D display. ⛔ It takes **any** depth map, so a real network can be substituted: this is the whole answer only where none is available, including in a browser. One pass over the source columns per row and no global sort — **6.3 ms** for a 4K frame on sixteen cores, 46.9 ms on a telephone — checked against a GPU implementation of the same rule, byte for byte."

[[params.repos]]
  name = "psd"
  pkg = "github.com/go-images/psd"
  url = "https://github.com/go-images/psd"
  status = "ready"
  blurb = "**Photoshop files (`.psd`, `.psb`) for `image.Decode`.** ⛔ The flattened **composite**, deliberately: reading layers means re-implementing a compositor, and the composite is what Photoshop itself shows. Bitmap, Grayscale, Indexed, RGB, CMYK, Duotone and Lab; 1, 8 and 16 bits a channel; raw and RLE. ⛔ CMYK is stored **inverted** (255 is no ink) and alpha is **straight** — the two readings that otherwise come out as a photographic negative and as every edge pixel too bright. Judged against `sips`, which is ImageIO and has nothing to do with this code: **exact on 2 073 600 pixels** of a real file."

[[params.repos]]
  name = "png"
  pkg = "github.com/go-images/png"
  url = "https://github.com/go-images/png"
  status = "ready"
  blurb = "**A fork of Go's `image/png`**, under the same licence, with every change stated in its NOTICE and Go's own suite passing unaltered. What differs: `DecodePartial` says what a stream that **stopped early** did decode — the first rows, and the error that stopped it — because a picture still arriving is not the same thing as a picture that failed."

[[params.repos]]
  name = "jpeg"
  pkg = "github.com/go-images/jpeg"
  url = "https://github.com/go-images/jpeg"
  status = "ready"
  blurb = "**A fork of Go's `image/jpeg`.** What differs: a **four-component** JPEG's chroma is upsampled the way libjpeg does — reading between the samples — rather than by repeating each one, which is what made CMYK scans come back softer here than everywhere else."

[[params.repos]]
  name = "jpeg2000"
  pkg = "github.com/go-images/jpeg2000"
  url = "https://github.com/go-images/jpeg2000"
  status = "ready"
  blurb = "**A pure-Go JPEG 2000 codec** (`.j2k`, `.jp2`, decode and encode), forked from ajroetker/go-jpeg2000 with every change stated in its NOTICE. ⛔ A file that says **CMYK** decodes to an `*image.CMYK`: read as red, green and blue it lost the black plate, 255 levels off poppler on every pixel, and it is now at most 2 over 2 440 044 samples. Tiled encodes now land where the decoder and OpenJPEG read them. The lossless colour transform and the inverse 5/3 wavelet are plain loops, because the SIMD path took an allocating fallback on amd64. A lossless 1080p decode there went from **638 ms and 14.55 million allocations to 269 ms and 93 thousand**, and arm64 is not slower. ⛔ Not yet under the organisation's 100% coverage gate: it is tested on eight architectures, but its coverage is not gated."

[[params.repos]]
  name = "gif"
  pkg = "github.com/go-images/gif"
  url = "https://github.com/go-images/gif"
  status = "ready"
  blurb = "**A fork of Go's `image/gif`**, with the same `DecodePartial` as `png`: the first frame at its full declared size, the number of pixel rows that are complete counting from the top, and the error that stopped the decode."

[[params.repos]]
  name = "webp"
  pkg = "github.com/go-images/webp"
  url = "https://github.com/go-images/webp"
  status = "ready"
  blurb = "**WebP encoding in pure Go**: the RIFF container, a **lossless** VP8L encoder (the pixels out bit for bit as they went in) and a **lossy** VP8 one with a quality from 0 to 100. On a rasterised page of text the lossless form is half the size of PNG; on a photograph the lossy form is 26× smaller than the lossless one."
